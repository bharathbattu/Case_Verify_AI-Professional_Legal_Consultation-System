# =============================================================================
# Case-Verify AI — Continuous Integration Pipeline
# T-03 / Hardening Plan
#
# Triggers: push/PR to main, manual dispatch
# Jobs:
#   1. lint      — flake8 static analysis
#   2. typecheck — syntax compilation of all .py files
#   3. test      — pytest with coverage
#   4. security  — pip-audit dependency vulnerability scan (S-08)
#   5. docker    — validate Dockerfile builds successfully
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=__pycache__,venv,.venv,env

  # ---------------------------------------------------------------------------
  # Job 2: Syntax / compile check
  # ---------------------------------------------------------------------------
  syntax-check:
    name: Syntax check (py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Compile all .py files
        run: |
          echo "Compiling all Python files..."
          FAIL=0
          for f in $(find . -name '*.py' -not -path './.venv/*' -not -path './venv/*' -not -path './__pycache__/*'); do
            python -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>&1 || FAIL=1
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more files failed syntax check"
            exit 1
          fi
          echo "All files compiled successfully."

  # ---------------------------------------------------------------------------
  # Job 3: Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          GEMINI_API_KEY: "test_key_ci"
          ENVIRONMENT: "development"
        run: |
          pytest --tb=short -q

  # ---------------------------------------------------------------------------
  # Job 4: Security — dependency vulnerability scan
  # ---------------------------------------------------------------------------
  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies + pip-audit
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        # --strict returns non-zero if any vulnerabilities found
        # Allow failure initially so teams can triage existing vulns
        continue-on-error: true
        run: |
          pip-audit --strict --desc on 2>&1 | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit-report.txt

  # ---------------------------------------------------------------------------
  # Job 5: Docker build validation
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, syntax-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: case-verify-ai:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
